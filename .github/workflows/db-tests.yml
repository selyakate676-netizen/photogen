name: Crystal Wallet DB Tests

on:
  workflow_dispatch:
  push:
    branches:
      - feature/crystal-wallet-ledger
      - feature/rub-generation-payment-gate

permissions:
  contents: read

jobs:
  wallet-pgtap:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Prepare ephemeral Supabase migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase init
          mkdir -p supabase/migrations
          cp supabase_schema.sql supabase/migrations/20260807000100_base_schema.sql
          cp supabase_personas_migration.sql supabase/migrations/20260807000200_personas.sql
          cp supabase_personas_hardening.sql supabase/migrations/20260807000300_personas_hardening.sql
          cp supabase_personas_guard_fix.sql supabase/migrations/20260807000400_personas_guard_fix.sql
          cp supabase_photoshoot_persona.sql supabase/migrations/20260807000500_photoshoot_persona.sql
          cp supabase_photoshoot_persona_rpc_fix.sql supabase/migrations/20260807000600_photoshoot_persona_rpc_fix.sql
          cp supabase_persona_appearance.sql supabase/migrations/20260807000700_persona_appearance.sql
          cp supabase_persona_photos_v2.sql supabase/migrations/20260807000800_persona_photos_v2.sql
          cp supabase_photoshoot_lifecycle.sql supabase/migrations/20260807000900_photoshoot_lifecycle.sql
          cp supabase_persona_photos_v2_completion.sql supabase/migrations/20260807001000_persona_photos_v2_completion.sql
          cp supabase_rpc_acl_hardening.sql supabase/migrations/20260807001100_rpc_acl_hardening.sql
          cp supabase_crystal_wallet.sql supabase/migrations/20260807001200_crystal_wallet.sql
          cp supabase_marketing_attribution.sql supabase/migrations/20260807001300_marketing_attribution.sql
          cp supabase_yookassa_payments.sql supabase/migrations/20260807001400_yookassa_payments.sql
          cp supabase_user_consents.sql supabase/migrations/20260807001500_user_consents.sql
          cp supabase_persona_photo_safe_deletion.sql supabase/migrations/20260807001600_persona_photo_safe_deletion.sql

      - name: Start ephemeral Supabase
        run: supabase start

      - name: Run Persona pgTAP regressions
        shell: bash
        run: |
          set -euo pipefail
          supabase test db tests/personas.pgtap.sql
          supabase test db tests/personas_limits.pgtap.sql
          supabase test db tests/persona_appearance.pgtap.sql
          supabase test db tests/photoshoot_persona.pgtap.sql
          supabase test db tests/persona_photos_completion.pgtap.sql

      - name: Run Persona photo safe deletion pgTAP tests
        run: supabase test db tests/persona_photo_safe_deletion.pgtap.sql

      - name: Run user consent pgTAP tests
        run: supabase test db tests/user_consents.pgtap.sql

      - name: Run YooKassa payment pgTAP tests
        run: supabase test db tests/yookassa_payments.pgtap.sql

      - name: Run crystal wallet pgTAP tests
        shell: bash
        run: |
          set -euo pipefail
          cat supabase_photoshoot_crystal_charge.sql > tests/crystal_wallet_ci.pgtap.sql
          cat supabase_failed_generation_refund.sql >> tests/crystal_wallet_ci.pgtap.sql
          grep -v '^\\ir ../supabase_photoshoot_crystal_charge.sql$' tests/crystal_wallet.pgtap.sql \
            | awk '{ print } !injected && $0 == "begin;" { print "grant select on table public.personas, public.persona_photos to service_role;"; print "grant select, insert on table public.photoshoots to service_role;"; injected = 1 }' \
            >> tests/crystal_wallet_ci.pgtap.sql
          supabase test db tests/crystal_wallet_ci.pgtap.sql

      - name: Run RUB generation payment gate pgTAP tests
        shell: bash
        run: |
          set -euo pipefail
          cat supabase_photoshoot_crystal_charge.sql > tests/rub_generation_payment_gate_ci.pgtap.sql
          cat supabase_failed_generation_refund.sql >> tests/rub_generation_payment_gate_ci.pgtap.sql
          cat tests/rub_generation_payment_gate.pgtap.sql >> tests/rub_generation_payment_gate_ci.pgtap.sql
          supabase test db tests/rub_generation_payment_gate_ci.pgtap.sql


      - name: Run photoshoot lifecycle pgTAP tests
        run: supabase test db tests/photoshoot_lifecycle.pgtap.sql

      - name: Run marketing attribution pgTAP tests
        run: supabase test db tests/marketing_attribution.pgtap.sql

      - name: Run RPC ACL hardening pgTAP tests
        run: supabase test db tests/rpc_acl_hardening.pgtap.sql

      - name: Stop ephemeral Supabase
        if: always()
        run: supabase stop --no-backup
