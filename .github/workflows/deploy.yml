name: Deploy to VPS

on:
  push:
    branches: ["main"]

permissions: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy immutable release via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          DEPLOY_SHA: ${{ github.sha }}
          RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_YANDEX_METRIKA_ID: ${{ vars.NEXT_PUBLIC_YANDEX_METRIKA_ID }}
        with:
          envs: DEPLOY_SHA,RELEASE_ID,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_YANDEX_METRIKA_ID
          host: ${{ secrets.VPS_IP }}
          username: photogen
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          script: |
            set -euo pipefail
            readonly DEPLOY_ROOT=/srv/photogen
            readonly REPO_DIR="$DEPLOY_ROOT/repo"
            readonly RELEASES_DIR="$DEPLOY_ROOT/releases"
            readonly SHARED_DIR="$DEPLOY_ROOT/shared"
            readonly CURRENT_LINK="$DEPLOY_ROOT/current"
            readonly RELEASE_DIR="$RELEASES_DIR/$RELEASE_ID"
            readonly PRODUCTION_ENV_FILE="$SHARED_DIR/.env.local"
            readonly PM2_BIN=/usr/bin/pm2
            readonly PM2_HOME=/home/photogen/.pm2
            readonly CANDIDATE_PORT=3002
            export PM2_HOME
            candidate_pid=""
            cutover_started=0
            previous_release=""

            rollback_on_error() {
              exit_code=$?
              trap - EXIT
              if [ -n "$candidate_pid" ]; then
                kill "$candidate_pid" 2>/dev/null || true
                wait "$candidate_pid" 2>/dev/null || true
              fi
              if [ "$exit_code" -ne 0 ] && [ "$cutover_started" -eq 1 ] && [ -n "$previous_release" ]; then
                echo "Deploy failed after cutover; restoring previous release"
                ln -sfn "$previous_release" "$CURRENT_LINK"
                "$PM2_BIN" delete photogen >/dev/null 2>&1 || true
                "$PM2_BIN" start "$CURRENT_LINK/scripts/start-production.sh" --name photogen --interpreter /usr/bin/bash
                "$PM2_BIN" save
              fi
              exit "$exit_code"
            }
            trap rollback_on_error EXIT

            : "${DEPLOY_SHA:?DEPLOY_SHA is required}"
            : "${RELEASE_ID:?RELEASE_ID is required}"
            : "${NEXT_PUBLIC_SUPABASE_URL:?NEXT_PUBLIC_SUPABASE_URL is required}"
            : "${NEXT_PUBLIC_SUPABASE_ANON_KEY:?NEXT_PUBLIC_SUPABASE_ANON_KEY is required}"
            : "${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required}"
            : "${NEXT_PUBLIC_YANDEX_METRIKA_ID:?NEXT_PUBLIC_YANDEX_METRIKA_ID is required}"
            test "$(id -un)" = photogen
            test -x "$PM2_BIN"
            test -d "$REPO_DIR/.git"
            test -s "$PRODUCTION_ENV_FILE"
            test -L "$CURRENT_LINK"
            previous_release=$(readlink -f "$CURRENT_LINK")
            test -d "$previous_release"
            test ! -e "$RELEASE_DIR"

            mkdir -p "$RELEASES_DIR"
            cd "$REPO_DIR"
            git fetch --prune origin main
            git cat-file -e "$DEPLOY_SHA^{commit}"
            git worktree add --detach "$RELEASE_DIR" "$DEPLOY_SHA"
            cd "$RELEASE_DIR"
            ln -s "$PRODUCTION_ENV_FILE" .env.local
            npm ci --no-audit --no-fund
            rm -rf .next
            npm run build
            test -f .next/BUILD_ID

            if curl --fail --silent "http://127.0.0.1:$CANDIDATE_PORT/" >/dev/null 2>&1; then
              echo "Candidate port $CANDIDATE_PORT is already in use"
              exit 1
            fi
            PORT="$CANDIDATE_PORT" "$RELEASE_DIR/scripts/start-production.sh" >"$DEPLOY_ROOT/candidate.log" 2>&1 &
            candidate_pid=$!
            candidate_ready=0
            for wait_attempt in $(seq 1 20); do
              kill -0 "$candidate_pid" 2>/dev/null || { echo "Candidate exited before smoke passed"; exit 1; }
              if curl --fail --silent --show-error "http://127.0.0.1:$CANDIDATE_PORT/" >/dev/null; then
                candidate_ready=1
                break
              fi
              sleep 1
            done
            test "$candidate_ready" -eq 1
            kill "$candidate_pid"
            wait "$candidate_pid" 2>/dev/null || true
            candidate_pid=""

            cutover_started=1
            ln -sfn "$RELEASE_DIR" "$CURRENT_LINK"
            "$PM2_BIN" delete photogen >/dev/null 2>&1 || true
            "$PM2_BIN" start "$CURRENT_LINK/scripts/start-production.sh" --name photogen --interpreter /usr/bin/bash
            "$PM2_BIN" save
            production_ready=0
            for wait_attempt in $(seq 1 20); do
              if curl --fail --silent --show-error http://127.0.0.1:3001/ >/dev/null; then
                production_ready=1
                break
              fi
              sleep 1
            done
            test "$production_ready" -eq 1
            "$PM2_BIN" describe photogen >/dev/null
            cutover_started=0
            trap - EXIT
            echo "Deployed SHA: $DEPLOY_SHA"
            echo "Rollback release retained: $previous_release"
